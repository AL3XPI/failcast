[workspace]
resolver = "3"
members = [
    "crates/failcast-core",
    "crates/failcast-store",
    "crates/failcast-collectors",
    "crates/failcast-ml",
    "crates/failcast-runners",
    "crates/failcast-eval",
    "crates/failcast-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AL3XPI/failcast"
homepage = "https://github.com/AL3XPI/failcast"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
forust-ml = "0.8"
predicates = "3"
quick-xml = "0.37"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.34", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
uuid = { version = "1", features = ["v4"] }

failcast-core = { version = "0.1.1", path = "crates/failcast-core" }
failcast-store = { version = "0.1.1", path = "crates/failcast-store" }
failcast-collectors = { version = "0.1.1", path = "crates/failcast-collectors" }
failcast-ml = { version = "0.1.1", path = "crates/failcast-ml" }
failcast-runners = { version = "0.1.1", path = "crates/failcast-runners" }
failcast-eval = { version = "0.1.1", path = "crates/failcast-eval" }
